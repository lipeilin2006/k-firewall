[workspace]
resolver = "2"
members = [
    "k-firewalld",
    "k-firewall-cli",
    "k-firewall-common",
    "k-firewall-ebpf",
]
default-members = ["k-firewalld", "k-firewall-cli", "k-firewall-common"]

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
aya = { version = "0.14.0", default-features = false }
aya-build = { version = "0.2.0", default-features = false }
aya-ebpf = { version = "0.2.1", default-features = false }
aya-log = { version = "0.3.0", default-features = false }
aya-log-ebpf = { version = "0.2.0", default-features = false }
network-types = { version = "0.2.0", default-features = false }

anyhow = { version = "1", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
scalar_api_reference = "0.1.0"
cargo_metadata = { version = "0.23.0", default-features = false }
clap = { version = "4.5.20", default-features = false, features = ["std"] }
futures-core = { version = "0.3", default-features = false }
futures-sink = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false }
libc = { version = "0.2.159", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false }
serde_yaml_ng = { version = "0.9" }
tokio = { version = "1.40.0", default-features = false }
tokio-stream = { version = "0.1", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
which = { version = "6.0.0", default-features = false }

[profile.release]
panic = "abort"

[profile.release.package.k-firewall-ebpf]
debug = 2
codegen-units = 1
strip = false

[profile.dev]
panic = "abort"
