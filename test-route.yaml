# 路由模式 FIB 测试：veth 两对 + 两个 netns
#   ra0(10.0.1.1) <-> ra1(ns1 10.0.1.2)
#   rb0(10.0.2.1) <-> rb1(ns2 10.0.2.2)
# ns1/ns2 经 ra0/rb0 上的 XDP 走 bpf_fib_lookup 转发。
global:
  node_name: kfw-test-route

interfaces:
  - name: ra0
    role: lan
    mode: route
    address: 10.0.1.1
  - name: rb0
    role: lan
    mode: route
    address: 10.0.2.1

xdp_mode: generic
default_action: pass
stats_interval_secs: 3

daemon:
  unix_socket: /var/run/k-firewall.sock

suricata:
  enabled: false
