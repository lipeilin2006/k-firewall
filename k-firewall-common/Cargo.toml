[package]
name = "k-firewall-common"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = []
# 用户态 eBPF map 键/值（提供 aya::Pod 实现）
user = ["aya"]
# daemon / CLI 之间 JSON 交互类型（依赖 serde，隐含 std）
api = ["dep:serde"]

[dependencies]
aya = { workspace = true, optional = true }
serde = { workspace = true, optional = true, default-features = true, features = ["derive"] }

[lib]
path = "src/lib.rs"
